<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS PWA App</title>
    <base href="/sms-pwa" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="sms-pwa.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Script to Remove Integrity Check dynamically (Fixes Digest Error) -->
    <script>
                const originalFetch = window.fetch;
                window.fetch = function () {
                    const args = Array.prototype.slice.call(arguments);
                    if (args[1] && args[1].integrity) {
                        delete args[1].integrity;
                    }
                    return originalFetch.apply(this, args);
                };
    </script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
                Blazor.start({
                    loadBootResource: function (type, name, defaultUri, integrity) {
                        // Return URI without integrity check
                        return defaultUri;
                    }
                });
    </script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
